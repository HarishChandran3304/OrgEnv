[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orgenv"
version = "0.1.0"
description = "A small deterministic framework for organizational environments: people, authority, time and information"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
llm = ["openai>=1.0"]
trials = ["openai>=1.0", "anthropic[bedrock]>=0.40", "harbor"]

[tool.setuptools.packages.find]
include = ["orgenv*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tasks"]
pythonpath = ["."]
addopts = "-q"
