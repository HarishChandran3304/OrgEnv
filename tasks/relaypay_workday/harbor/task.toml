schema_version = "1.4"

[[artifacts]]
source = "/state/evidence.json"
service = "runtime"

[[artifacts]]
source = "/state/verifier-key"
service = "runtime"

[task]
name = "orgenv/relaypay-workday"
version = "3.0.0"
description = "Contain a recurring-billing incident across worker pools you do not all control, repair interacting payment and event-handling defects, coordinate support and reconciliation, and resume billing without harming customers."
keywords = ["organizational", "payments", "reconciliation", "incident", "idempotency"]

[metadata]
difficulty = "hard"
category = "software-engineering"
tags = ["orgenv", "authorization", "idempotency", "dynamic"]

[agent]
timeout_sec = 7200
user = "1000"

[environment]
build_timeout_sec = 600
network_mode = "no-network"
cpus = 1
memory_mb = 768
storage_mb = 2048
workdir = "/workspace"

[environment.healthcheck]
command = "orgenvctl catalog >/dev/null"
interval_sec = 1
timeout_sec = 5
retries = 15

[verifier]
timeout_sec = 300
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600
cpus = 1
memory_mb = 1024
storage_mb = 2048
